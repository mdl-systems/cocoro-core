# cocoro-core — Docker Compose (Production)
# Cloudflare Tunnel 経由での外部公開を前提とした本番設定
#
# 使い方:
#   cd infra/docker
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# 必須環境変数 (.env に設定すること):
#   GEMINI_API_KEY, COCORO_API_KEY, POSTGRES_PASSWORD, JWT_SECRET

services:
  cocoro:
    environment:
      # ===== 本番固定設定 =====
      - FORCE_HTTPS=true
      - LOG_LEVEL=WARNING
      - LOG_FORMAT=json

      # セキュリティ強化
      - RATE_LIMIT_ENABLED=true
      - AUDIT_LOG_ENABLED=true
      - ENABLE_IP_FILTER=false          # Cloudflare Tunnel 使用時は不要

      # Cloudflare Tunnel 情報 (ヘルスチェックレスポンスに反映)
      - TUNNEL_ENABLED=true
      - TUNNEL_URL=https://console.cocoro.ai
      - LOCAL_URL=http://192.168.50.92

      # ログファイル出力先
      - LOG_FILE=/var/log/cocoro/cocoro.log

      # スケジューラ（本番は長めのインターバル）
      - CONSOLIDATION_INTERVAL_HOURS=12
      - EMOTION_DECAY_INTERVAL_HOURS=2
      - SYNC_RECORD_INTERVAL_HOURS=24
      - OBSERVATION_REPORT_INTERVAL_HOURS=48
      - MEMORY_ARCHIVE_INTERVAL_HOURS=48
      - AUTO_THINK_INTERVAL_HOURS=2

    # ===== リソース制限 =====
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
        reservations:
          cpus: "0.5"
          memory: 512m
    # docker-compose v2 互換のリソース制限
    mem_limit: 2g
    cpus: 2.0

    # ログローテーション
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

    # ヘルスチェック
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    restart: always

  cocoro-postgres:
    # 本番用リソース制限
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
        reservations:
          cpus: "0.25"
          memory: 256m
    mem_limit: 1g
    cpus: 1.0

    # WAL設定・パフォーマンスチューニング
    command: >
      postgres
      -c max_connections=50
      -c shared_buffers=256MB
      -c effective_cache_size=512MB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c log_min_duration_statement=1000
      -c log_connections=off
      -c log_disconnections=off

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

    restart: always

  cocoro-redis:
    # 本番用リソース制限
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
        reservations:
          cpus: "0.1"
          memory: 128m
    mem_limit: 512m
    cpus: 0.5

    command: >
      redis-server
      --maxmemory 400mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
      --save 3600 1
      --loglevel warning

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    restart: always

  # ===== Nginx (リバースプロキシ) =====
  cocoro-nginx:
    image: nginx:1.25-alpine
    container_name: cocoro-nginx
    ports:
      - "80:80"
      # HTTPS は Cloudflare Tunnel が終端するため不要
      # SSL 直接終端する場合は以下を有効化:
      # - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx-logs:/var/log/nginx
    networks:
      - cocoro-net
    depends_on:
      - cocoro
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128m
    mem_limit: 128m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: always

volumes:
  pg-data:
  nginx-logs:
